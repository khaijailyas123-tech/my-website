<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | AutoTalk AI</title>
<meta name="description" content="AutoTalk AI builds AI call agents and chatbots that answer customers, qualify leads and book appointments 24/7.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="page-head"><div class="wrap"><h1>Get your free demo</h1><p>Tell us about your business. We reply within one working day.</p></div></div>

<section>
  <div class="wrap">
    <div class="contact-grid">
      <form id="quote-form">
        <div><label for="name">Your name</label><input id="name" required></div>
        <div><label for="phone">Phone number</label><input id="phone" type="tel" required></div>
        <div><label for="msg">What do you need?</label><textarea id="msg" placeholder="For example: a call agent for my clinic" required></textarea></div>
        <button class="btn" type="submit">Send on WhatsApp</button>
      </form>
      <div class="details">
        <p><strong>Phone / WhatsApp</strong><a href="tel:+923271288575">+92 327 1288575</a></p>
        <p><strong>Email</strong><a href="mailto:youremail@gmail.com">youremail@gmail.com</a></p>
        <p><strong>Working hours</strong>Monday to Saturday, 9 am to 5 pm</p>
        <p>Outside working hours, use the chat button at the bottom right. Our assistant will reply.</p>
      </div>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="script.js"></script>
</body>
</html>
